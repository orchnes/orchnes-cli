# Autonomous release: crates.io, prebuilt binaries + GitHub Release, and npm.
# It runs when the version in Cargo.toml is not yet published:
#   - merge a PR that bumps `version` in Cargo.toml (push to main), or
#   - push a tag vX.Y.Z that matches Cargo.toml, or
#   - run this workflow manually (also retries a partially failed release).
# crates.io: Trusted Publishing (OIDC) for this file in the `crates-io` environment.
# npm: Trusted Publishing (OIDC) for this file in the `npm` environment; the
# NPM_TOKEN secret is used only if present (first publish of a new package).
name: Publish

on:
  push:
    branches: [main]
    paths: [Cargo.toml]
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build and test binaries only; publish nothing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      crates: ${{ steps.meta.outputs.crates }}
      npm: ${{ steps.meta.outputs.npm }}
      release: ${{ steps.meta.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Decide what needs publishing
        id: meta
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"; exit 1
          fi
          ua="orchnes-cli-release (https://github.com/orchnesai/orchnes-cli)"
          crates=$(curl -s -o /dev/null -w '%{http_code}' -A "$ua" "https://crates.io/api/v1/crates/orchnes/$version")
          npm=$(curl -s -o /dev/null -w '%{http_code}' "https://registry.npmjs.org/orchnes/$version")
          echo "crates=$([ "$crates" = 200 ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          echo "npm=$([ "$npm" = 200 ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          assets=$(gh release view "v$version" -R "$GITHUB_REPOSITORY" --json assets --jq '.assets|length' 2>/dev/null || echo 0)
          echo "release=$([ "$assets" -ge 6 ] && echo false || echo true)" >> "$GITHUB_OUTPUT"
          echo "orchnes $version: crates.io $crates, npm $npm, release assets $assets"

  crates:
    needs: plan
    if: needs.plan.outputs.crates == 'true' && inputs.dry_run != true
    runs-on: ubuntu-latest
    environment: crates-io
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - run: cargo publish --dry-run --locked
      - name: Get a short-lived crates.io token (OIDC)
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6
      - run: cargo publish --locked
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  binaries:
    needs: plan
    if: inputs.dry_run == true || needs.plan.outputs.release == 'true' || needs.plan.outputs.npm == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - {os: ubuntu-latest, target: x86_64-unknown-linux-musl, ext: ""}
          - {os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl, ext: ""}
          - {os: macos-latest, target: aarch64-apple-darwin, ext: ""}
          - {os: macos-latest, target: x86_64-apple-darwin, ext: ""}
          - {os: windows-latest, target: x86_64-pc-windows-msvc, ext: ".exe"}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: contains(matrix.target, 'musl')
        run: sudo apt-get update -q && sudo apt-get install -y -q musl-tools
      - name: Build
        shell: bash
        run: |
          cargo build --release --locked --target ${{ matrix.target }}
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/orchnes${{ matrix.ext }}" "dist/orchnes-${{ matrix.target }}${{ matrix.ext }}"
      - name: Smoke test
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: ./dist/orchnes-${{ matrix.target }}${{ matrix.ext }} --version
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: orchnes-${{ matrix.target }}
          path: dist/orchnes-${{ matrix.target }}${{ matrix.ext }}
          if-no-files-found: error
          retention-days: 5

  release:
    needs: [plan, binaries, crates]
    if: always() && inputs.dry_run != true && needs.binaries.result == 'success' && needs.crates.result != 'failure'
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the GitHub Release and upload assets
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: orchnes-*
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum orchnes-* > SHA256SUMS && cat SHA256SUMS
      - name: Create or update the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if ! gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$tag" -R "$GITHUB_REPOSITORY" --title "$tag" --target "$GITHUB_SHA" --generate-notes
          fi
          gh release upload "$tag" dist/* -R "$GITHUB_REPOSITORY" --clobber
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sha256sums
          path: dist/SHA256SUMS
          retention-days: 5

  npm:
    needs: [plan, release]
    if: always() && needs.release.result == 'success' && needs.plan.outputs.npm == 'true'
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: sha256sums
          path: npm
      - name: Stamp version and checksums
        working-directory: npm
        env:
          VERSION: ${{ needs.plan.outputs.version }}
        run: |
          set -euo pipefail
          node -e '
            const fs=require("fs");
            const p=JSON.parse(fs.readFileSync("package.json","utf8"));p.version=process.env.VERSION;
            fs.writeFileSync("package.json",JSON.stringify(p,null,2)+"\n");
            const sums={};for(const line of fs.readFileSync("SHA256SUMS","utf8").trim().split("\n")){const [h,f]=line.trim().split(/\s+/);sums[f]=h;}
            if(Object.keys(sums).length!==5)throw Error("expected 5 binaries, got "+Object.keys(sums).length);
            fs.writeFileSync("checksums.json",JSON.stringify(sums,null,2)+"\n");'
          rm SHA256SUMS
          node --test test/*.test.mjs
          npm pack --dry-run
      - name: Publish
        working-directory: npm
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail
          # Trusted publishing (OIDC) needs no token; a token is used only for a first publish.
          if [ -n "${NPM_TOKEN:-}" ]; then
            echo "//registry.npmjs.org/:_authToken=${NPM_TOKEN}" > "$HOME/.npmrc"
          fi
          npm publish --provenance --access public
          rm -f "$HOME/.npmrc"
