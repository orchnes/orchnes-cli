name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # The skills library, so integration tests also run against the real 26 skills.
      - uses: actions/checkout@v7
        with:
          repository: orchnesai/orchnes-360
          path: orchnes-360
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
        env:
          ORCHNES_SKILLS_DIR: ${{ github.workspace }}/orchnes-360/skills
