[package]
name = "orchnes"
version = "0.2.0"
edition = "2024"
license = "MIT"
description = "Orchnes 360 CLI: install, validate, route and export Agent Skills, and call any model through one gateway"
authors = ["Ömer Faruk Alibal"]
repository = "https://github.com/orchnesai/orchnes-cli"
homepage = "https://orchnes.com"
keywords = ["agent-skills", "ai-agents", "llm", "orchestration", "cli"]
categories = ["command-line-utilities", "development-tools"]
readme = "README.md"

[[bin]]
name = "orchnes"
path = "src/main.rs"

[dependencies]
# CLI argument parsing with derive macros; de-facto standard.
clap = { version = "4.6", features = ["derive"] }
# Derive (de)serialization for frontmatter, contracts and verdicts.
serde = { version = "1", features = ["derive"] }
# YAML backend for serde; maintained fork of serde_yaml (deprecated on crates.io since 0.9.34).
serde_norway = "0.9"
# Typed library errors without boilerplate.
thiserror = "2"
# Error context and propagation in the binary only.
anyhow = "1"
# Writes per-skill .zip files for Claude.ai upload; pure-Rust deflate only, no other codecs.
zip = { version = "9", default-features = false, features = ["deflate-flate2-zlib-rs"] }
# Blocking HTTP client for the model gateway; small dependency tree, rustls TLS by default.
ureq = "3"
# Provider request/response bodies are free-form JSON.
serde_json = "1"

[dev-dependencies]
# Self-cleaning temp dirs for fixtures and export tests.
tempfile = "3"
